name: Klipp Lab

# The fork's build (utalpt/klipp), as in Rawr 17U:
# - a push to xiaomi-17u builds the APK, runs the fork's tests and republishes the `debug` prerelease, so its link stays
#   fixed: https://github.com/utalpt/klipp/releases/download/debug/klipp17u-debug.apk
# - a push to a test branch (hlg, …) only keeps the run's artifact; on test/ branches the unit tests run only with
#   [tests] in the commit message. [skip tests] in the commit message only builds.
# - an annotated tag v<Klipp's version>-17u.<N> (e.g. v0.21.0-beta.1-17u.1) publishes the signed release: the tag's
#   message is the "What's new" (else the version's section of CHANGELOG-17U.md), then .github/release-footer.md.
# Signed with the release key from the repository's secrets whenever it is there, so every CI APK installs over the
# previous one and over the releases.
on:
  push:
    branches: [xiaomi-17u, hlg, 'test/**']
    # a push that only changes text (README, changelog) builds nothing - and so cancels no build still running
    paths-ignore: ['**.md', 'docs/**']
    tags: ['v*-17u.*']
  workflow_dispatch:
    inputs:
      skip_tests:
        description: "Skip the unit tests (APK only)"
        type: boolean
        default: false

# a new push cancels the run still going (no minutes spent on an old commit)
concurrency:
  group: klipp-17u-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  android:
    name: Klipp Lab APK and tests
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      # the NDK and CMake (~1.5 GB) from the cache after the first run
      - uses: actions/cache@v4
        id: ndk
        with:
          path: |
            /usr/local/lib/android/sdk/ndk/29.0.14206865
            /usr/local/lib/android/sdk/cmake/3.31.6
          key: ndk-29.0.14206865-cmake-3.31.6
      - name: NDK and CMake
        if: steps.ndk.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;29.0.14206865" "cmake;3.31.6"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      # a prebuilt cargo-ndk (seconds instead of compiling it every run)
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk
      - name: Build the engine bridge
        working-directory: rust
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/29.0.14206865"
          RUSTFLAGS="--remap-path-prefix=$HOME=~" cargo ndk -t arm64-v8a --platform 29 -o ../app/src/main/jniLibs build --release
      # Gradle's dependencies, wrapper and build cache are kept between runs - written by every branch's runs, test
      # branches included (by default only the default branch writes, so each test build started from an old cache)
      - uses: gradle/actions/setup-gradle@v5
        with:
          cache-read-only: false
      # compiler cache for whisper.cpp (CMake): Gradle's build cache doesn't keep native builds, unchanged files aren't
      # rebuilt (as in Rawr 17U)
      - uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: klipp-native-arm64
          max-size: 1G
      - name: Version
        id: ver
        run: |
          base=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          n=$(sed -n 's/^ *val klipp17u = \([0-9]*\)$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$base" ] || [ -z "$n" ]; then echo "::error::version not found in app/build.gradle.kts"; exit 1; fi
          if [ "$n" -lt 1 ] || [ "$n" -gt 99 ]; then echo "::error::the fork's release number must be 1-99"; exit 1; fi
          echo "version=$base-17u.$n" >> "$GITHUB_OUTPUT"
          echo "Klipp Lab $base-17u.$n"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$base-17u.$n" ]]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match the build's version v$base-17u.$n"; exit 1
          fi
      # the release key from the repository's secrets (Klipp's build reads it through KLIPP_KEYSTORE); without them
      # the APK is signed with the debug key – fine for testing, refused for a release
      - name: Release key
        env:
          KEYSTORE_B64: ${{ secrets.KLIPP_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.KLIPP_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KLIPP_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KLIPP_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No release key: debug-signed APK"
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then echo "::error::a release needs the release key"; exit 1; fi
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          { echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"; } > "$RUNNER_TEMP/keystore.properties"
          echo "KLIPP_KEYSTORE=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"
      # the APK first (it is uploaded even if a test fails)
      - name: Klipp Lab build
        env:
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          # hash the compiler by content (the NDK comes from a cache) and paths relative to the checkout
          CCACHE_COMPILERCHECK: content
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: "true"
        run: |
          ./gradlew --build-cache assembleRelease
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/klipp17u-${{ steps.ver.outputs.version }}.apk"
      # (a private repository – the test builds' – has a small artifact quota: its APK goes to a prerelease instead)
      - uses: actions/upload-artifact@v7
        if: ${{ !github.event.repository.private }}
        with:
          name: klipp17u-${{ github.sha }}
          path: out/*.apk
          retention-days: 14
      # Klipp Lab: in the private test repository the APK is the `test-build` prerelease (release files don't count
      # against the artifact quota); klipp-build.ps1 downloads it from there when the release is of this commit
      - name: Test build prerelease (private repository)
        if: github.event.repository.private && github.event_name == 'push' && startsWith(github.ref, 'refs/heads/test/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk klipp17u-test.apk
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build klipp17u-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test build" --notes "CI build of ${GITHUB_SHA} (${{ steps.ver.outputs.version }}), branch ${GITHUB_REF_NAME}."
      # the tests on debug: the Compose test rule needs debug's test activity (ui-test-manifest is debug only)
      - name: Unit tests (OpenDRT, export plan)
        # (on a test/ branch only with [tests] in the commit message: they compile the whole app again for debug, ~3 min,
        # and check OpenDRT and the export plan, rarely touched; xiaomi-17u and the tags always run them)
        if: ${{ startsWith(github.ref, 'refs/tags/') || (!(github.event.inputs.skip_tests == 'true' || contains(github.event.head_commit.message, '[skip tests]')) && (!startsWith(github.ref, 'refs/heads/test/') || contains(github.event.head_commit.message, '[tests]'))) }}
        run: ./gradlew --build-cache testDebugUnitTest --tests 'se.gendut.klipp.OpenDrtTest' --tests 'se.gendut.klipp.ExportPlanTest'
      - uses: actions/upload-artifact@v7
        if: ${{ failure() && !github.event.repository.private }}
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14
      # a push to xiaomi-17u republishes the `debug` prerelease, so its download link stays the same
      - name: Publish debug prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/xiaomi-17u'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp out/*.apk klipp17u-debug.apk
          gh release delete debug --cleanup-tag --yes || true
          gh release create debug klipp17u-debug.apk --prerelease --target "$GITHUB_SHA" \
            --title "Debug build" \
            --notes "CI build of ${GITHUB_SHA::8} (${{ steps.ver.outputs.version }}), not a release. Installs beside Klipp as Klipp Lab."
      # a tag: the release, with the annotated tag's message (else the version's CHANGELOG-17U.md section) and the footer
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          {
            if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
              git for-each-ref --format='%(contents)' "refs/tags/$GITHUB_REF_NAME" | sed '/-----BEGIN PGP SIGNATURE-----/,$d'
            else
              awk -v v="## $VERSION" '$0==v{on=1;next} /^## /{if(on)exit} on' CHANGELOG-17U.md
            fi
            cat .github/release-footer.md
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" out/*.apk --latest --title "Klipp Lab $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
